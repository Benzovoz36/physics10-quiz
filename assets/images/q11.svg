<rect width="800" height="450" fill="url(#bg)"/>
<rect width="800" height="450" fill="url(#dots)"/>
<rect x="16" y="16" width="768" height="418" rx="26" fill="none" stroke="#5b4a86" stroke-width="2" stroke-dasharray="10 9"/>

