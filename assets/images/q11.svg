  <line x1="210" y1="248" x2="230" y2="248" stroke="#ece5ff" stroke-width="9" stroke-linecap="round"/>
  <text x="186" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#ece5ff" text-anchor="start">+</text>
